name: Build NerdQAxe++ (trinetra)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true
    - name: Version
      run: |
        git fetch --tags || true
        echo "VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)-trinetra-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    - name: Set Target
      run: |
        docker run --rm --user root -e BOARD=NERDQAXEPLUS2 -v $PWD:/home/builder/project shufps/esp-idf-builder:0.0.1 idf.py set-target esp32s3
    - name: Build
      run: |
        docker run --rm --user root -e BOARD=NERDQAXEPLUS2 -v $PWD:/home/builder/project shufps/esp-idf-builder:0.0.1 idf.py build
    - name: Merge factory image
      run: |
        docker run --rm --user root -v $PWD:/home/builder/project shufps/esp-idf-builder:0.0.1 esptool.py --chip esp32s3 merge_bin --flash_mode dio --flash_size 16MB --flash_freq 80m \
          0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/esp-miner.bin \
          -o esp-miner-factory-NerdQAxe++-${{ env.VERSION_TAG }}.bin || echo "merge skipped"
        ls -la build/*.bin build/www.bin 2>/dev/null || true
        sudo cp build/esp-miner.bin esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.bin
        sha256sum esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.bin > esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.sha256
        cat esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.sha256
    - name: Upload app binary
      uses: actions/upload-artifact@v4
      with:
        name: esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}
        path: |
          esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.bin
          esp-miner-NerdQAxe++-${{ env.VERSION_TAG }}.sha256
          build/www.bin
          build/esp-miner.elf
        retention-days: 14
